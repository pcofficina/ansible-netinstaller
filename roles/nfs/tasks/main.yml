---
# tasks file for netinstaller.nfs

- name: Install NFS server package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Configure NFS exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_mint_export }}"
    regexp: "{{ iso_linuxmint_basepath_dir }}"
  notify: Restart NFS Server

- name: Ensure NFS service is running and enabled
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
